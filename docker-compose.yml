# Pour l'instant : uniquement Pi-hole (le DNS que l'agent mettra à jour pour bloquer un domaine).
# Le service applicatif (bot + pipeline + navigateur isolé) arrive dans les prochains jours.
services:
  pihole:
    image: pihole/pihole:2026.10.0
    container_name: reflex-pihole
    environment:
      TZ: Europe/Paris
      # Pas de mot de passe par défaut : docker compose refuse de démarrer tant qu'il n'est pas défini dans .env.
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?définis PIHOLE_PASSWORD dans .env}
      FTLCONF_dns_listeningMode: all
    # Ports ouverts sur 127.0.0.1 seulement : invisibles depuis le reste du réseau (wifi partagé, etc.).
    ports:
      - "127.0.0.1:8081:80/tcp"     # interface web + API : http://localhost:8081/admin
      - "127.0.0.1:1053:53/tcp"     # DNS sur 1053 pour ne pas gêner celui du Mac
      - "127.0.0.1:1053:53/udp"
    volumes:
      - pihole:/etc/pihole
    restart: unless-stopped

volumes:
  pihole:
